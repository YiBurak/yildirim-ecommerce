services:
  # 🚀 1. BACKEND: ASP.NET Core .NET 10 WebApi
  backend:
    build:
      context: .
      dockerfile: EnterpriseECommerce.WebApi/Dockerfile
    container_name: ecommerce-backend
    ports:
      - "5041:5041"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 🐘 POSTGRESQL BAĞLANTISI:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Url=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=EnterpriseECommerce
      - Jwt__Audience=EnterpriseECommerceClient
      - Jwt__ExpiryMinutes=120
      - ClientUrl=${CLIENT_URL:-http://localhost}
      - Iyzico__ApiKey=${IYZICO_API_KEY}
      - Iyzico__SecretKey=${IYZICO_SECRET_KEY}
      - Iyzico__BaseUrl=${IYZICO_BASE_URL}
      # 📧 SMTP / E-POSTA AYARLARI (.env'den güvenli enjeksiyon):
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL}
      - Smtp__SenderName=YILDIRIM

    depends_on:
      - postgres
      - rabbitmq
      - redis
    restart: always

  # 🌐 2. FRONTEND: React 19 + Vite + Nginx
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # 🐘 3. DATABASE: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # İstersen dışarıdan pgAdmin / DBeaver ile bağlanmak için portu sadece localine açtık:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  # 📬 4. MESSAGE BROKER: RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    restart: always

  # ⚡ 5. DISTRIBUTED CACHE: Redis
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: redis-server --requirepass ${REDIS_PASS}
    restart: always

# 💾 Kalıcı PostgreSQL Veritabanı Alanı:
volumes:
  postgres-data:
