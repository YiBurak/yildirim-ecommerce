server {
    listen 80;
    server_name localhost;

    # 1. SPA React Yönlendirmesi (Sayfa yenilendiğinde 404 vermesini engeller)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend REST API Ters Vekili (Reverse Proxy - Canlıda CORS sorununu tamamen bitirir!)
    location /api/ {
        proxy_pass http://backend:5041/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. SignalR Canlı WebSocket Kanalı Ters Vekili
    location /hubs/ {
        proxy_pass http://backend:5041/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
